<!DOCTYPE html>
<html>
  <head>
    <title>MyProfile</title>
    <meta charset="UTF-8">
    <meta name="description" content="Webデザイナー｜ポートフォリオ">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <!-- ヘッダー -->
     <header>
      <div class="header-inner">
        <h1>
          <a href="index.html">MyProfile</a>
        </h1>

      <!-- pc用ナビゲーション -->
       <nav>
        <ul id="menu">
          <li><a href="#about">About</a></li>
          <li><a href="#works">Works</a></li>
        </ul>
       </nav>
      </div>
     </header>

     <main>
      <article>
        <!-- メインビジュアル -->
         <div>
           <img class="main-visual" src="images/main.png" alt="カメラの写真">
         </div>
         
        <!-- アバウト --> 
        <section>
         <h2 class="h2">About</h2>
          <div id="about-inner">
           <div id="content">
            <img id="about-photo" src="images/about.png" alt="顔写真">
           </div>
           <div id="self-introduction">
            <h2>Kazuki Asahina</h2>
            <ul>
             <li>25歳 長野県佐久市出身</li>
             <li>ソフトウェア業界でマーケティングに従事</li>
             <li>趣味はカメラ、愛機はCanon</li>
             <li>自然を撮影するのが好きで、海や山によく行く</li>
            </ul>
           </div>
         </div>
        </section>

         <!-- ワーク -->
         <section>
          <h2 class="h2">Works</h2>
          <div class="works-inner">
            <div class="works-inner-box">
              <img src="images/works1.png" alt="日本海">
              <p>新潟に訪れた際に、日本海の雄大さに魅了されて撮影した1枚</p>
            </div>
            <div class="works-inner-box">
              <img src="images/works2.png" alt="御嶽山">
              <p>地元長野の木曽町から撮影した、冠雪した御嶽山</p>
            </div>
            <div class="works-inner-box">
              <img src="images/works3.png" alt="町並み">
              <p>京都で撮影した、明け方の古き良き日本の町並み</p>
            </div>
          </div>
         </section>
      </article>
     </main>

        <!-- フッター -->
         <footer>
              <p>&copy;MyProfile. All rights reserved.</p>
         </footer>
  </body>
</html>
